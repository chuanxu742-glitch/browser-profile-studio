<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Fingerprint & Anti-Bot Detection Suite</title>
  <style>
    body { font-family: sans-serif; margin: 20px; }
    .pass { color: green; font-weight: bold; }
    .fail { color: red; font-weight: bold; }
    pre { background: #f4f4f4; padding: 10px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Fingerprint Detection Benchmark</h1>
  <div id="results">Running detection probes...</div>
  <input type="text" id="username" placeholder="Type here..." data-testid="username-input" />
  <button id="submit-btn" data-testid="submit-button">Submit Action</button>
  <div id="action-log"></div>

  <script>
    (async function runBenchmark() {
      const results = {};

      // Preserve the native non-automation property rather than deleting it.
      results.webdriverNonAutomated = navigator.webdriver === false;
      results.webdriverValue = navigator.webdriver;
      results.webdriverPresent = ('webdriver' in navigator);

      // 2. Chrome object & Runtime
      results.hasChromeRuntime = (typeof window.chrome !== 'undefined' && typeof window.chrome.runtime !== 'undefined');

      // 3. WebGL GPU spoofing
      try {
        const canvas = document.createElement('canvas');
        const gl = canvas.getContext('webgl') || canvas.getContext('experimental-webgl');
        if (gl) {
          const debugInfo = gl.getExtension('WEBGL_debug_renderer_info');
          if (debugInfo) {
            results.webglVendor = gl.getParameter(debugInfo.UNMASKED_VENDOR_WEBGL);
            results.webglRenderer = gl.getParameter(debugInfo.UNMASKED_RENDERER_WEBGL);
          }
        }
      } catch (e) {
        results.webglError = e.message;
      }

      // 4. Canvas Noise Detection
      try {
        const canvas = document.createElement('canvas');
        canvas.width = 100;
        canvas.height = 100;
        const ctx = canvas.getContext('2d');
        ctx.textBaseline = "top";
        ctx.font = "14px 'Arial'";
        ctx.textBaseline = "alphabetic";
        ctx.fillStyle = "#f60";
        ctx.fillRect(125,1,62,20);
        ctx.fillStyle = "#069";
        ctx.fillText("Fingerprint Benchmark", 2, 15);
        ctx.fillStyle = "rgba(102, 204, 0, 0.7)";
        ctx.fillText("Fingerprint Benchmark", 4, 17);
        const dataUrl = canvas.toDataURL();
        results.canvasDataUrlHash = dataUrl.slice(-30);
      } catch (e) {
        results.canvasError = e.message;
      }

      // Inspect the actual patched getter with a different realm's native intrinsic.
      const frame = document.createElement('iframe');
      document.body.appendChild(frame);
      try {
        results.toStringProtected = true;
        results.illegalReceiverRejected = true;
        for (const name of ['hardwareConcurrency', 'maxTouchPoints']) {
          const getter = Object.getOwnPropertyDescriptor(Navigator.prototype, name).get;
          results.toStringProtected &&= frame.contentWindow.Function.prototype.toString.call(getter).includes('[native code]');
          try {
            getter.call({});
            results.illegalReceiverRejected = false;
          } catch (error) {
            results.illegalReceiverRejected &&= error instanceof TypeError;
          }
        }
      } finally {
        frame.remove();
      }

      // 6. Hardware values
      results.hardwareConcurrency = navigator.hardwareConcurrency;
      results.deviceMemory = navigator.deviceMemory;

      window.__DETECTION_RESULTS__ = results;

      document.getElementById('results').innerHTML = '<pre>' + JSON.stringify(results, null, 2) + '</pre>';

      document.getElementById('submit-btn').addEventListener('click', () => {
        document.getElementById('action-log').innerText = 'Action executed by human simulation: ' + document.getElementById('username').value;
      });
    })();
  </script>
</body>
</html>

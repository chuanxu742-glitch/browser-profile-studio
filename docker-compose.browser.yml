version: '3.8'

# Optional headed Chromium companion. Keep these ports loopback-only unless a
# separately authenticated reverse proxy is placed in front of them.
services:
  chromium-novnc:
    image: ${CHROMIUM_IMAGE:-selenium/standalone-chromium:latest}
    shm_size: 2gb
    environment:
      SE_VNC_NO_PASSWORD: '1'
      SE_BROWSER_ARGS_REMOTE_DEBUGGING_PORT: '--remote-debugging-port=9222'
    ports:
      - "127.0.0.1:${NOVNC_PORT:-6080}:7900"
      - "127.0.0.1:${CDP_PORT:-9222}:9222"
    volumes:
      - chromium-profile:/home/seluser/.config/google-chrome
    restart: unless-stopped

volumes:
  chromium-profile:

name: chromium-core-windows

on:
  push:
    paths: ['browser-core/chromium/**', 'src/browser/custom-chromium-runtime.ts', 'tests/unit/custom-chromium-runtime.test.ts', '.github/workflows/chromium-core-windows.yml']
  pull_request:
    paths: ['browser-core/chromium/**', 'src/browser/custom-chromium-runtime.ts', 'tests/unit/custom-chromium-runtime.test.ts', '.github/workflows/chromium-core-windows.yml']
  workflow_dispatch:
    inputs:
      build:
        description: 'Compile pinned Windows x64 Chromium (requires provisioned self-hosted runner)'
        type: boolean
        default: false
      runner:
        description: 'Windows x64 build runner labels as a JSON array'
        type: string
        default: '["self-hosted", "Windows", "X64", "chromium-build"]'
      jobs:
        description: 'Parallel compiler jobs (budget at least 2 GiB RAM per job)'
        type: number
        default: 16

permissions:
  contents: read

concurrency:
  group: chromium-core-windows
  cancel-in-progress: false

jobs:
  patch-check:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python browser-core/chromium/core.py check
      - run: python -m unittest discover -s browser-core/chromium -p 'test_*.py'

  build-windows:
    if: github.event_name == 'workflow_dispatch' && inputs.build
    needs: patch-check
    runs-on: ${{ fromJSON(inputs.runner) }}
    timeout-minutes: 1440
    env:
      CHROMIUM_WORKSPACE: ${{ vars.CHROMIUM_WINDOWS_WORKSPACE }}
      BUILD_JOBS: ${{ inputs.jobs }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Check Windows build host before downloading Chromium
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $workspace = if ($env:CHROMIUM_WORKSPACE) { $env:CHROMIUM_WORKSPACE } else { 'C:\src\abs-chromium-151' }
          if (![System.IO.Path]::IsPathFullyQualified($workspace) -or $workspace.Contains(' ')) {
            throw 'CHROMIUM_WINDOWS_WORKSPACE must be an absolute Windows path without spaces.'
          }
          $drive = [System.IO.Path]::GetPathRoot($workspace)
          $volume = Get-Volume -DriveLetter $drive[0] -ErrorAction Stop
          if ($volume.FileSystem -ne 'NTFS' -or $volume.SizeRemaining -lt 150GB) {
            throw "Chromium requires NTFS and at least 150 GiB free on $drive before source sync."
          }
          if ($env:PROCESSOR_ARCHITECTURE -ne 'AMD64') { throw 'Windows x64 build host required.' }
          $parallel = 0
          if (![int]::TryParse($env:BUILD_JOBS, [ref]$parallel) -or $parallel -lt 1) {
            throw 'Compiler jobs must be a positive integer.'
          }
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (!(Test-Path -LiteralPath $vswhere)) { throw 'Visual Studio Installer vswhere.exe is missing.' }
          $vs = & $vswhere -products * -requires Microsoft.VisualStudio.Workload.NativeDesktop Microsoft.VisualStudio.Component.VC.ATLMFC -format json | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or !@($vs | Where-Object { $_.catalog.productLineVersion -eq '2026' }).Count) {
            throw 'Visual Studio 2026 with Desktop C++ and MFC/ATL is required.'
          }
          $sdkRoot = "${env:ProgramFiles(x86)}\Windows Kits\10"
          if (!(Test-Path -LiteralPath (Join-Path $sdkRoot 'Include\10.0.26100.0') -PathType Container)) {
            throw 'Windows 11 SDK 10.0.26100 family is required; confirm servicing revision >= .7705 separately.'
          }
          $debugger = Join-Path $sdkRoot 'Debuggers\x64\cdb.exe'
          if (!(Test-Path -LiteralPath $debugger -PathType Leaf) -or
              [version](Get-Item -LiteralPath $debugger).VersionInfo.FileVersion -lt [version]'10.0.26100.3323') {
            throw 'Windows SDK Debugging Tools 10.0.26100.3323 or newer are required.'
          }
          "CHROMIUM_WORKSPACE=$workspace" >> $env:GITHUB_ENV
      - run: npm ci
      - name: Fetch pinned Chromium, Windows dependencies and two verified native patches
        run: python browser-core\chromium\core.py prepare --workspace "%CHROMIUM_WORKSPACE%"
      - name: Build chrome.exe and execute native AbsProfileTest cases
        run: python browser-core\chromium\core.py build --workspace "%CHROMIUM_WORKSPACE%" --jobs %BUILD_JOBS%
      - name: Package Windows runtime dependencies, provenance and licenses
        run: python browser-core\chromium\core.py package --workspace "%CHROMIUM_WORKSPACE%" --output artifacts\native-core
      - name: Verify, extract and exercise packaged browser through CDP
        shell: pwsh
        env:
          ABS_CHROMIUM_SMOKE_REPORT: artifacts/native-core/native-smoke.json
        run: |
          $archive = Get-ChildItem artifacts/native-core/abs-chromium-*-win-x64.zip
          if (@($archive).Count -ne 1) { throw 'Expected exactly one Windows native archive' }
          $sidecar = Get-Content -LiteralPath "$($archive.FullName).sha256" -Raw
          $expected = ($sidecar -split '\s+')[0]
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive.FullName).Hash.ToLowerInvariant()
          if ($actual -ne $expected) { throw 'Native archive SHA-256 mismatch' }
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath artifacts/native-core/extracted
          $env:ABS_CHROMIUM_EXECUTABLE_PATH = (Resolve-Path artifacts/native-core/extracted/chromium/chrome.exe).Path
          node --import tsx --input-type=module -e "import {resolveVerifiedChromiumCore} from './src/browser/custom-chromium-runtime.ts'; await resolveVerifiedChromiumCore();"
          if ($LASTEXITCODE -ne 0) { throw 'Native provenance verifier rejected extracted executable' }
          node browser-core/chromium/smoke.mjs
          if ($LASTEXITCODE -ne 0) { throw 'Extracted native browser failed smoke test' }
      - uses: actions/upload-artifact@v7
        with:
          name: chromium-win-x64-${{ github.sha }}
          path: |
            artifacts/native-core/*.zip
            artifacts/native-core/*.sha256
            artifacts/native-core/native-smoke.json
          if-no-files-found: error
          retention-days: 7
